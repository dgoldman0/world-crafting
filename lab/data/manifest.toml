use = "The Sun's spectral irradiance at 1 AU, 202-2730 nm, for each world whose star is the Sun (star.spectrum): the sunlight at the top of the air and the ice-optics weights"
licence = "LASP states that TSIS data products are available for public access (lasp.colorado.edu/tsis/data, read 2026-10-18). Neither LISIRD's page for the dataset nor its metadata (tsis1_hsrs.das) states a licence or terms of redistribution, so the lab keeps its copy in the store, outside Git, and cites the authors and LISIRD."
