# The data the lab's own stages read, by pin (lab/design/world_spec.md, rule 4). Each entry lists its files, each
# with its size, sha256, one source (a URL to download, or a Terluna pin to copy) and the date the lab took its
# bytes. Each entry also records the terms its licence review found (AGENTS.md, "File and evidence practice"),
# the credit and the review's date. The lab keeps its copy of each file in the store, as data/<first 16 hex
# digits of its sha256>/<name> (lab/worldlab/data.py). Retrieval and hash checks are separate from reading the
# publications the credits name. The store also keeps one file outside this manifest, stage 1's copy of Terluna's
# lakes file, which no stage reads (lab/design/world_spec.md, "Settled in code").

schema = "worldlab.manifest/0"

