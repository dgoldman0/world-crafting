[data.hitemp2010-h2o]
title = "HITEMP2010's water lines, 0 to 30,000 cm-1, in the 34 zips HITRANonline serves"
use = "The steam columns of plan stage 9's reproduction (python/atmosphere/waterworlds/hitemp.py): the lines whose strength at 1000 K reaches 1e-30 cm/molecule, as Schaefer et al. (2016) cut them for the model that Arnscheidt, Wordsworth and Ding (2019) used"
licence = "HITRANonline serves HITEMP2010 to registered users who sign in. Its HITEMP page (hitran.org/hitemp, read 2026-10-19) states no licence or terms of redistribution and asks users to cite the appropriate HITEMP article as well as the original sources of the data. The lab keeps its copy in the store, outside Git, and cites the HITEMP article, the BT2 line list and HITRANonline."
credit = "Rothman, L. S., Gordon, I. E., Barber, R. J., Dothe, H., Gamache, R. R., Goldman, A., Perevalov, V. I., Tashkun, S. A. & Tennyson, J. (2010), HITEMP, the high-temperature molecular spectroscopic database, J. Quant. Spectrosc. Radiat. Transfer 111, 2139-2150; for water chiefly from the BT2 line list, Barber, R. J., Tennyson, J., Harris, G. J. & Tolchenov, R. N. (2006), A high-accuracy computed water line list, Mon. Not. R. Astron. Soc. 368, 1087-1094; distributed by HITRANonline (hitran.org)"
reviewed = 2026-10-19
note = "Downloaded by the author with their own sign-in on 2026-10-19; hitran.org sends a request without one to its sign-in page, so a fresh copy needs the same. The zips hold 114,241,164 lines, HITEMP2010's count for water, in HITRAN's 160-character records closed by CR LF, one .par member to each zip."

