# Earth as a body: the standing control. Draft schema 0 (lab/design/world_spec.md). Values from Terluna's
# shared/constants.json at 186b294 unless marked.

schema = "worldlab.world/0"
id = "earth"
kind = "found"
title = "Earth"

[body]
radius_m = 6371000.0                 # earth.radius_m
gm_m3_s2 = 3.986004418e14            # earth.gm_m3_s2; GM/R^2 = 9.8203 m/s2
gravity_m_s2 = 9.80665               # given: standard gravity, the effective surface value with rotation; the
                                     # models' own Earth values are their adapters' (CM1 9.81, PlaSim 9.80665)

[rotation]
sidereal_period_days = 0.99726957    # earth.sidereal_day_s 86164.0905 / 86400
solar_day_days = 1.0                 # given: the mean solar day, 86,400 s; the two periods give 0.9999999 d
obliquity_deg = 23.4393              # earth.obliquity_deg

[orbit]
star = "sun"
semi_major_axis_au = 1.0             # NASA GSFC Earth Fact Sheet: 149.598 million km, 1.000 AU
sidereal_year_days = 365.25636       # NASA GSFC Earth Fact Sheet: 365.256 d; Terluna's runner types 365.25636
eccentricity = 0.0167                # NASA GSFC Earth Fact Sheet (updated 15 November 2024; read 2026-10-17);
                                     # not in Terluna's constants

[star]
id = "sun"
spectrum = "tsis1-hsrs-stride100"
constant_w_m2 = 1361.0               # sun.solar_constant_W_m2

[surface]
geometry = "model-default"           # ExoPlaSim's own Earth land and topography, for the control
