# Earth's dry air at sea level, given by mole fraction; the lab derives its partial pressures as it does every
# scenario's. The ozone, seas and land are ExoPlaSim's own Earth settings.
# The sunlight is the world's TSIS-1 spectrum at 1361 W/m2, where released ExoPlaSim runs Earth at 1367 W/m2 by
# default (exoplasim/__init__.py:2003), so the released run of the comparison takes the same sunlight and air
# through ExoPlaSim's own interface. Draft schema 0.

schema = "worldlab.scenario/0"
id = "earth/control"
world = "earth"
kind = "found"
title = "Earth control: 1 atm of Earth's dry air with 400 ppm CO2"

[air]
reference_level = "sea"
surface_pressure_pa = 101325.0               # the standard atmosphere
o2_mole_fraction = 0.2095                    # Earth's dry air (Terluna exoplasim_run.py:78)
co2_ppm = 400.0                              # a model choice: the lunar design air's value (exoplasim_run.py:80),
                                             # so the control and the Moon share their CO2
ar_mole_fraction = 0.00934                   # Earth's dry air (exoplasim_run.py:79)
balance = "N2"
reference_temperature_k = 288.0      # Earth's global mean (paper/data/worlds.json, "global means")
cloud_droplets_per_cm3 = 100.0       # a model choice: the Open Moon's value, held for the comparison
ozone = "model-default"              # ExoPlaSim's ozone profile, as the released model runs Earth
water_vapour = "prognostic"

[water]
seas = "model-default"               # ExoPlaSim's Earth land-sea mask
ocean = { kind = "slab", mixed_layer_m = 50.0, sea_ice = true }   # a model choice: the Open Moon runs' ocean
                                                                   # (exoplasim_run.py:92), so both run on one ocean

[land]
albedo = "model-default"

[sunlight]
filter = "none"                      # the Sun reaches Earth's air unfiltered
scale = 1.0                          # the world's TSIS-1 total, 1361 W/m2 at 1 AU

[forcing]
top_infrared_w_m2 = { day = 0.0, night = 0.0 }   # zero: the most Earth receives, from the full Moon, is about 0.03 W/m2
