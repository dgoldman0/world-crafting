# An illustrative breathable Mars, as in the paper's map of reach (paper/data/worlds.json, "Mars at 1 bar"):
# Earth-like air at 1 bar, built with the Open Moon's recipe. An illustration: its unchosen fields must be
# chosen before any run.
# Draft schema 0.

schema = "worldlab.scenario/0"
id = "mars/breathable-1bar"
world = "mars"
kind = "illustrative"
title = "Mars held at 1 bar of Earth-like air"

[air]
reference_level = "mean-radius"      # Mars has no sea level; the pressure holds at the mean radius
surface_pressure_pa = 100000.0       # 1 bar, the illustration's premise
reference_temperature_k = 288.0      # Earth's mean, as paper/data/worlds.json takes it for "Mars at 1 bar"
o2_partial_pressure_pa = 21227.0
co2_ppm = 400.0
ar_per_n2 = 0.011961477
balance = "N2"
ozone = "unchosen"
water_vapour = "prognostic"

[water]
seas_share = "unchosen"
ocean = { kind = "slab", mixed_layer_m = 50.0, sea_ice = true }   # a model choice: the Open Moon runs' ocean
                                                                   # (exoplasim_run.py:92), held for comparison

[land]
albedo = "unchosen"

[sunlight]
filter = "none"                      # the illustration supposes no shield
scale = 1.0                          # the Sun's total at Mars's distance, from the orbit

[forcing]
top_infrared_w_m2 = { day = 0.0, night = 0.0 }   # zero: the illustration supposes no source in space
