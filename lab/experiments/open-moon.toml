# Two of Terluna's GCM experiments and three of its CM1 cases, written in draft schema 0
# (lab/design/world_spec.md) as the targets of plan.md stages 2 and 3. The aliases are Terluna's folder names; the
# lab identifies each item by the key of its resolved inputs. Terluna's definitions: climate/crm/cm1_run.py,
# CASES (:1093-1526).

schema = "worldlab.experiments/0"

[experiment.A28_corrected_970]
model = "exoplasim"
scenario = "moon/open-moon"
config = "exoplasim/terluna-corrected"
years = 20
initial = { from = "A28_corrected_9685", year = 19, sha256_16 = "d65b88aa68443890" }   # a branch, as recorded
purpose = "the design case of the corrected radiation, at the sunlight scale that holds the design temperature"
recorded_key = "b4d10329a8723d42"            # progress.json; stage 2 must reproduce it

[experiment.A28_corrected_970_lw_ice]
extends = "A28_corrected_970"
initial = { from = "A28_corrected_970", year = 19 }
purpose = "the longwave by height and ice optics, from the design case's year 19; settles near 307 K"
recorded_key = "14070719b35c52d7"

[experiment.A28_corrected_970_lw_ice.set]    # the declared delta; the lab refuses the pair if anything else differs
"config.switches.longwave_correction" = true
"config.switches.ice_optics" = true
"config.heating_diagnostics" = true           # diagnostics only: nine more outputs, the same prognostic fields

[case.ring_45n_corrected]
model = "cm1"
experiment = "A28_corrected_970"
years = [10, 19]
kind = "ring"                                  # a circle of latitude
latitude_deg = 45.0
band_deg = 3.0                                 # the GCM row nearest the latitude
config = "cm1/terluna-ring"
large_scale_w = "gcm"
land_moisture = "gcm"
days = 59.06
purpose = "the 45 N ring on the corrected design case"

[case.ring_45n_corrected_twilight]
extends = "ring_45n_corrected"
purpose = "the 45 N ring with the curved air's twilight and side light"

[case.ring_45n_corrected_twilight.set]         # the declared delta
"twilight" = "full"                            # var20 = 1 and terluna_twilight.txt
"patches" = ["series-twilight"]               # added to the configuration's series-core
# Defined here, both cases take their builds from the same configuration and differ in the twilight series alone.
# Terluna ran the control on moon_omp, compiled at -O2 and never rebuilt, and this case on moon_omp_twilight at
# -O3 -march=native (defect log C8); the importer's pair check compares the two imported records and flags the
# optimisation difference outside the declared delta.

[case.box_jura]
model = "cm1"
experiment = "A28_corrected_970"
years = [10, 19]
kind = "box"
site = { ring = "ring_45n_corrected", lat_deg = 45.0, lon_deg = 323.875, radius_m = 100000.0 }   # the ring's grid and reference
columns = { nx = 100, ny = 90 }
config = "cm1/terluna-ring"
patches = ["series-terrain", "series-sea", "series-twilight"]   # added to the configuration's series-core
terrain = { half_width_deg = 0.125, passes = 2, taper_km = 50.0, sea = true }
day_night = { from_case = "ring_45n_corrected_twilight", from_day = 29.5, wavenumbers = 5, bins = 36, harmonics = 4, top_m = 16000.0 }
twilight = "full"
large_scale_w = "gcm"
land_moisture = "gcm"
surface_output = true
days = 59.06
purpose = "Jura Island at its heights with the sea and islets round it, forced by the corrected design case and the 45 N twilight ring's day-night circulation"
