[[entry]]
id = "B13"
model = "exoplasim"
where = "plasim/src/radmod.f90, swr (35 / sqrt(1 + 1224 mu^2))"
form = "geometry"
assumes = "Earth's horizon air mass, sqrt(pi R / 2H) = 35"
when = [{ q = "chapman_horizon", outside = [31.5, 38.5] }]    # proposed: 10% either side of 35
effect = "the low Sun's water path is wrong, most for the tallest air"
state = "repaired"
repair = { patches = ["07-curved-air", "08-gas-bands"], switch = "ZMLUNAR (07), ZMAIRLUNAR (08)", from = "ledger:curved-air" }
action = "require-refit"                     # a ledger of the world's own column
evidence = ["notes/defect_log.md B13", "notes/reference_radiation.md, section 2"]

[[entry]]
id = "B17"
model = "exoplasim"
where = "plasim/src/radmod.f90, swr (Lacis and Hansen's water absorptivity)"
form = "fit beyond its range"
assumes = "Earth's water paths"
when = [{ calibration = "calibration:plasim-shortwave", outside_envelope = true }]
effect = "the air absorbed 7.7-8.2 points too little of the arriving sunlight on the Moon's columns before the fit"
state = "calibrated"
repair = { patch = "05-water-shortwave-absorptivity", switch = "SWH2OSCALE" }
action = "require-refit"
evidence = ["notes/defect_log.md B17"]

[[entry]]
id = "B30"
model = "exoplasim"
where = "plasim/src/rainmod.f90, mkrain (gamma = 0.01; 0.007 at T42 on ten levels)"
form = "constant"
assumes = "Earth's rain: a share of each layer's saturation deficit evaporated in each step, set for Earth's drops, their fall speeds and Earth's layer depths"
when = [{ q = "gravity_m_s2", ne = 9.80665, rel_tolerance = 1e-3 }, { config = "exoplasim.switches.rain_evaporation", ne = "drop_sizes" }]
effect = "falling rain evaporates by Earth's tuning whatever its drops: 29% of PlaSim's rain on the Open Moon, where Terluna's CM1 boxes with lunar drops evaporated 61%"
state = "repaired"
repair = { patch = "14-rain-from-drop-sizes", switch = "NEVAPPREC", value = 2, default = 1, namelist = ["NRDROP_JOIN", "RDROP_WARM", "RDROP_MELT", "RDROP_KSC", "RDROP_RHOEXP", "RDROP_STEP"], table = "lab_rain_law.txt", setting = "exoplasim.switches.rain_evaporation" }
action = "warn"
note = "the repair evaporates the rain from its drops' sizes and fall speeds, with the fall law, the self-collection rate and the breakup's density exponent computed for the world's air at 2 m by python/climate/gcm/rain_drops.py; the rule and the sizes of the rain's births are a calibration (exoplasim-rain-births); the action is a warning, since each fix enters the lab opt-in (PLAN.md) and the Earth control's test of the scheme is still to be run; the patch at its default runs Earth's control byte for byte as the build before it, and no lab run has measured the scheme's effect on a climate; the snow's sublimation keeps gamma"
evidence = ["notes/defect_log.md B30", "notes/exoplasim.md, Rain from its drops' sizes", "models/exoplasim/README.md, Rain from drop sizes (patch 14)"]

[[entry]]
id = "exoplasim-rain-births"
model = "exoplasim"
where = "patch 14, NRDROP_JOIN, RDROP_WARM and RDROP_MELT: the rule by which rain formed as rain makes its drops, and the mean diameters of new rain and of rain melted from snow"
form = "fit beyond its range"
assumes = "the gravity, the surface pressure and the level set of the cloud-resolving boxes on which the births were fitted"
when = [{ config = "exoplasim.switches.rain_evaporation", eq = "drop_sizes" },
        { calibration = "calibration:plasim-rain-births", outside_envelope = true }]    # proposed (lab/design/terluna_fixes.md, row 8)
effect = "the share of new drops follows the layers' thickness: on CM1's own levels Terluna's rule made 42-47% of the rain formed as rain into new drops, against 65-69% on PlaSim's fifteen layers, and its column evaporated 0.04-0.06 less of CM1's rain"
state = "calibrated"
repair = { patch = "14-rain-from-drop-sizes", switch = "NRDROP_JOIN, RDROP_WARM, RDROP_MELT" }
action = "require-refit"
note = "the lab has one calibration, Terluna's for the Open Moon on its fifteen levels: the share rule, 0.439 mm from its CM1 sea box and 2.95 mm from its McSnow run at 1 mm/h (python/climate/gcm/rain_drops.py, TERLUNA_OPEN_MOON_BIRTHS); the boxes behind it ran Earth's warm-rain rates (B38) and ice sized by Earth's limits; the design proposes gamma for a run outside the envelope, and the adapter refuses the drops' sizes in a run that states no births"
evidence = ["lab/design/terluna_fixes.md, row 8", "models/exoplasim/README.md, Rain from drop sizes (patch 14)"]

[[entry]]
id = "B31"
model = "exoplasim"
where = "plasim/src/plasim.f90, initpm (the ten half levels of its formula, NEQSIG 0)"
form = "geometry"
assumes = "Earth's scale height: the levels are fractions of the surface pressure chosen for Earth's air, the lowest full level at 0.0168 scale heights and the lowest layer 0.034 deep"
when = [{ q = "exoplasim_lowest_level_m", gt = 345.0 }]      # provisional and of low confidence (PLAN.md, Decisions, 11 November 2026): the tested range, 10% over the highest lowest-level height run so far, the 313 m at which the Open Moon's fifteen levels stand in Terluna's design runs at 301 K (307 m at the scenario's 295 K); to be revisited when the automatic rule for the heights is designed
effect = "the levels stand higher where the scale height is larger: the lowest full level at 0.14 km in Earth's air and at 0.88 km in the Open Moon's, where the lowest layer averages away the 1.4-2.3 kJ/kg of moist static energy that CM1's updraughts draw from the surface layer, and CM1's 6 km night boundary layer with its clouds' 7-8 km tops falls inside one layer"
state = "repaired"
repair = { setting = "exoplasim.levels", namelist = ["NEQSIG", "SIGH", "TFRC"], default = 10, tool = "python/climate/gcm/levels.py, generate" }
action = "warn"
note = "the repair is a level set generated for the world: the released model's upper half levels kept, and half levels at the heights the study states near the ground, counted at a scale height (python/climate/gcm/levels.py); the quantity is the height of the run's lowest full level at the scenario's scale height, 142 m for the Earth control and 882 m for the Open Moon on the released ten, and 307 m for the Open Moon on Terluna's fifteen, 299 m at the 51 km Terluna counts with; the action is a warning, since each fix enters the lab opt-in (PLAN.md), the heights are the study's to state, and the Earth control's test of a generated set is still to be run; no lab run has measured a set's effect on a climate; a run on a generated set takes calibrations by layer laid on its own half levels (the adapter refuses others) and a longwave correction fitted on its own columns (exoplasim-longwave-fit)"
evidence = ["notes/defect_log.md B31", "notes/exoplasim.md, Levels for a world", "models/exoplasim/README.md, Level sets", "lab/tests/test_builds.py, the level set's tests"]

[[entry]]
id = "exoplasim-longwave-fit"
model = "exoplasim"
where = "patch 09, lwcorr.dat: the extra escape to space of each layer and of the ground, over land and over sea"
form = "fit beyond its range"
assumes = "the level set, the state and the convection scheme of the columns on which the correction was fitted"
when = [{ config = "exoplasim.switches.longwave_correction", eq = true },
        { calibration = "calibration:plasim-longwave", outside_envelope = true }]
effect = "PlaSim's cooling of a layer depends on the layers around it: Terluna's correction fitted on ten levels, carried onto its fourteen and fifteen by the restart's remap, left 6.4-8.8 W/m2 by layer, where its provisional refit on the fifteen levels' own columns, over one month, left 1.9-2.1 W/m2 (Terluna's climate/gcm/README.md at 39c5ee04)"
state = "calibrated"
repair = { patch = "09-longwave-by-height", switch = "NLWCORR" }
action = "require-refit"
note = "the envelope of a calibration holds the GCM's level set among its dimensions (lab/design/architecture.md, Calibrations, envelopes and loops), so a calibration fitted on one set and read on another lies outside it; the adapter also refuses a table by layer whose stated half levels differ from the run's, the correction's and the curved-air ledger's alike, and the rain's births hold their level set in their own entry (exoplasim-rain-births); Terluna's fits are its own, and stage 5 fits the lab's"
evidence = ["notes/defect_log.md B18", "notes/defect_log.md B31", "lab/design/terluna_fixes.md, row 9"]

