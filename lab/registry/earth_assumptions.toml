[[entry]]
id = "B28"
model = "cm1"
where = "morrison.F (slope bounds, LAMMINR; brkup_db; the breakup law's 2300 /m; VCAPR)"
form = "fit beyond its range"
assumes = "Earth's largest raindrops and breakup, (sigma / (delta-rho g))^(1/2)"
when = [{ q = "gravity_m_s2", ne = 9.81, rel_tolerance = 0.005 }, { config = "cm1.physics.microphysics", eq = "morrison" },
        { config = "cm1.physics.rain_size_limits", ne = "capillary" }]
effect = "rain's mean diameter capped at 2.8 mm, breakup from 0.3 mm; at lunar gravity the stable drop is about 2.5 times larger"
state = "repaired"
repair = { patch = "lab/03-raindrop-limits-at-the-builds-gravity", switch = "brkup_gscale", value = 1, default = 0, namelist = ["brkup_rhor", "brkup_rhoexp"], scaling = "(9.81/g)^(1/2) on the cap; (9.81/g)^(1/2) brkup_rhor^brkup_rhoexp on the breakup's lengths; 9.1 (g/9.81)^(1/4) m/s on the fall speeds", setting = "cm1.physics.rain_size_limits" }
action = "warn"
note = "the repair scales Earth's breakup by the drops' Weber number, a similarity that no low-gravity measurement in the sources tests; with the switch on, brkup_db stays Morrison's 300 um, which the patch scales, and python/atmosphere/rain computes brkup_rhor and brkup_rhoexp for the world; one column of the patched scheme keeps its bits at the default in the suite, CM1's released supercell case kept its output there in a single scratch run on 11 November 2026, and stage 3 tests a lunar case on the lab's builds; the action stays warn, since each fix enters the lab opt-in (PLAN.md), where row 5 of lab/design/terluna_fixes.md proposed that B28 require the scaling off 9.81 m/s2; NSSL's two-moment rain has its explicit breakup off (irainbreak), and any other size limit stage 3 finds in it joins this entry; snow's and graupel's 2 mm caps stay Earth's, since surface tension limits liquid drops alone"
evidence = ["notes/defect_log.md B28", "notes/cm1.md, Fall speeds", "models/cm1/README.md, the lab's patches 03 and 04"]

[[entry]]
id = "cm1-rain-limits-range"
model = "cm1"
where = "morrison.F, the lab's patch 03: brkup_rhor**brkup_rhoexp on the breakup's lengths, and the scaling of the limits by (9.81/g)^(1/2)"
form = "fit beyond its range"
assumes = "a gravity from the Moon's to Earth's, the range over which Terluna computed the breakup's scale and its exponent on the air's density; the entry tests the lower side alone"
when = [{ q = "gravity_m_s2", lt = 1.62 }, { config = "cm1.physics.microphysics", eq = "morrison" },
        { config = "cm1.physics.rain_size_limits", eq = "capillary" }]
effect = "the run's scaled limits, fall-law table and self-collection rate are computed below the gravities for which Terluna computed the scale; within them the scale lay within 0.2% of the capillary ratio at Earth's air density and the exponent between 0.69 and 0.71 at 1.2 times that density"
state = "open"
action = "warn"
note = "the threshold is PLAN.md's, which sets a warning on the lower side; above Earth's 9.81 m/s2, where Terluna computed no scale either, the entry is silent. Outside the range the lab's own calculation gives an exponent of 0.692 at 1.21 m/s2 and 1.2 times Earth's density, a scale 0.4% above the capillary ratio at 1.3 m/s2 and Earth's density, and a scale 0.3% above it at 15 m/s2 (python/atmosphere/tests/test_rain_breakup.py), each a runnable calculation, as the values within the range are; the single-drop solver stops below about 0.48 m/s2, where the largest stable drop exceeds its 30 mm"
evidence = ["PLAN.md, Porting: confidence, form and cost", "models/cm1/README.md, the lab's patches 03 and 04", "notes/cm1.md, Fall speeds"]

[[entry]]
id = "B38"
model = "cm1"
where = "morrison.F (Khairoutdinov and Kogan's autoconversion 1350 qc^2.47 N^-1.79 and accretion 67 (qc qr)^1.15, above freezing and below)"
form = "fit beyond its range"
assumes = "Earth's gravity in the collisions that turn cloud into rain: droplets overtaking one another at Stokes speeds, and rain sweeping up cloud at its fall speed"
when = [{ q = "gravity_m_s2", ne = 9.81, rel_tolerance = 0.005 }, { config = "cm1.physics.microphysics", eq = "morrison" },
        { config = "cm1.physics.warm_rain_rates", ne = "gravity" }]
effect = "unmeasured; by scaling, Earth's rates are 9.81/g times the autoconversion's and (9.81/g)^0.6 times the accretion's at the world's gravity: 6.0 and 2.9 times at lunar gravity"
state = "open"
repair = { patch = "lab/05-factors-on-autoconversion-and-accretion", namelist = ["rain_autoconv_fac", "rain_accr_fac"], default = 1.0, scaling = "g/9.81 on the autoconversion; (g/9.81)^0.6 on the accretion", setting = "cm1.physics.warm_rain_rates" }
action = "warn"
note = "the factors are a scaling law from the scheme's two fall-speed exponents, which python/atmosphere/rain/warm_rain.py computes for a world; the law omits the collision efficiency's own dependence on the closing speed and collisions driven by turbulence, and the fits were made on Earth's drop spectra, so the state stays open until a sea box sizes the effect (PLAN.md, block 4, step 2); the action is a warning, since each fix enters the lab opt-in (PLAN.md) and no run has taken the factors; in the suite one column of the patched scheme keeps its bits at the defaults and scales each rate by its factor; the factors multiply the formulas that IRAIN = 0 selects, the only ones CM1's copy of the scheme takes; NSSL's rain, which the electrified build runs, keeps its own rates"
evidence = ["notes/defect_log.md B38", "notes/cm1.md, Fall speeds", "models/cm1/README.md, the lab's patch 05"]

