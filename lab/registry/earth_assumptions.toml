# The registry of Earth assumptions: a seed of twenty entries in draft schema 0 (lab/design/architecture.md,
# "The registry of Earth assumptions and the reach report"). Ids are the defect log's (notes/defect_log.md) where
# it has one; the rest are named by model. Conditions are all-of lists of tests on derived quantities (q),
# specification fields (field), the run's settings (config: its model's defaults with the study's changes) or a
# calibration's envelope (calibration). Tolerances are relative (rel_tolerance).
# Thresholds marked "proposed" come from the design and await the author's decision before the reach report uses
# them. A field a world leaves out holds no value, so that `ne` holds for it: A1 tests every world but one locked to
# its star (rotation.locked_to), whose star ExoPlaSim's synchronous mode holds still.
#
# action: require-switch | require-build | require-refit | warn | refuse
# state:  repaired | calibrated | bounded | open

schema = "worldlab.registry/0"

[[entry]]
id = "A1"
model = "exoplasim"
where = "plasim/src/radmod.f90, solang"
form = "latent defect"
assumes = "a rotation of exactly one day (rotspd = 1)"
when = [{ field = "rotation.locked_to", ne = "star" }, { q = "exoplasim_rotationperiod_days", ne = 1.0 }]
effect = "the Sun skips back 1/(N-1) of a turn each model day: 2 deg at a 2-day rotation, 10 deg at 10 and 12 days, 16 deg from just above 12 days to 20, 33 deg above 20"
state = "repaired"
repair = { patch = "04-sun-clock", switch = "NSUNCLOCK", value = 2, default = 0 }
action = "require-switch"
evidence = ["notes/defect_log.md A1", "notes/exoplasim.md, The Sun's clock"]

[[entry]]
id = "A2"
model = "exoplasim"
where = "plasim/src/radmod.f90, the orb_params call"
form = "latent defect"
assumes = "Earth's orbit for the start year"
when = []                                    # always: the configured tilt and eccentricity are otherwise discarded
effect = "Earth's 23.695 deg tilt and 0.0175 eccentricity replace the configured orbit, silently"
state = "repaired"
repair = { setting = "fixed_orbit", value = true, default = false }
action = "require-switch"
evidence = ["notes/defect_log.md A2"]

[[entry]]
id = "B1"
model = "cm1"
where = "constants.F, module_ra_etc.F, getcape.F, morrison.F (g = 9.81)"
form = "constant"
assumes = "g = 9.81 m/s2"
when = [{ q = "gravity_m_s2", ne = 9.81, rel_tolerance = 1e-6 }]
effect = "dynamics, RRTMG's layer masses, CAPE and fall speeds at Earth's gravity"
state = "repaired"
repair = { patches = ["core/01-04", "lab/06-gravity-co2-and-o2-from-the-namelist"], build_constant = "TERLUNA_G", namelist = ["world_g"], default = "the build's TERLUNA_G: 9.81 in a build without the macro", setting = "cm1.world_constants" }
action = "require-build"
note = "since 11 November 2026 patch 06 of the lab's CM1 series reads g from the namelist as world_g, whose default is the build's TERLUNA_G, with RRTMG's CO2 and O2 beside it as world_co2 and world_o2 (defect log B8); the action stays require-build, and cm1/defaults keeps world_constants = \"build\", until the one-day ring segments and the timing of plan stage 3 pass, when it becomes require-switch; in the suite the constants, the CAPE diagnostic, one column of RRTMG and one of Morrison's scheme told the Moon's gravity return the bits of the same code with it compiled in, and in single scratch runs of 11 November 2026 three hours of Terluna's 45 N ring, output and restart files alike, agreed byte for byte between a build with the Moon compiled in and one build told the Moon by the namelist, under both flag sets (models/cm1/README.md); the electrified series' NSSL still reads TERLUNA_G for its fall speeds, so an electrified build compiles the gravity in until its companion patch, and the model stops on the MYNN and MYJ schemes, which hold the build's gravity, where world_g differs from it"
evidence = ["notes/defect_log.md B1", "notes/cm1.md, Gravity", "models/cm1/README.md, the lab's patches 06 to 08"]

[[entry]]
id = "cm1-earth-g-schemes"
model = "cm1"
where = "module_sf_mynn.F, module_gfs_physcons.F, module_sf_gfdl.F, module_sf_exchcoef.F, module_mp_p3.F, mp_wsm6.F, module_mp_jensen_ishmael.F, lfoice.F, goddard.F, module_mp_nssl_2mom.F, radtrns3d.F (Earth's gravity as a number); module_bl_mynn_common.F, module_bl_myjpbl.F, module_sf_myjsfc.F (the build's gravity as a compile-time constant, 9.81 in a build that takes its world from the namelist)"
form = "constant"
assumes = "Earth's gravity in schemes the lunar cases do not select"
when = [{ q = "gravity_m_s2", ne = 9.81, rel_tolerance = 0.005 },   # proposed; the Earth control's 9.80665 passes
        { config = "cm1.physics", any_in = ["mynn", "myj", "gfs-edmf", "gfdl", "hurricane-exchange", "p3", "wsm6", "jensen-ishmael", "lfo", "gsfc-lfo", "nssl", "goddard"] }]
effect = "the scheme brings Earth's gravity back"
state = "open"
action = "refuse"
note = "the files with a number are those in which the suite finds one in the patched source (python/climate/tests/test_cm1_world.py); gsfc-lfo is the NASA-GSFC version of the LFO microphysics (ptype 2, goddard.F, 981 cm/s2 in its hail's drag) and nssl is CM1's own copy of the NSSL scheme (ptype 26 to 28, gr = 9.8), both added on 11 November 2026, where goddard names the Goddard radiation (radopt 1); the electrified variant's WRF-ELEC module, nssl-2mom-elec, takes the build's gravity (series-elec, patch 03). The MYNN and MYJ boundary layers and the MYJ surface layer take g of module_model_constants when they compile, so they follow a gravity compiled in as TERLUNA_G and keep 9.81 in a build told its gravity by the namelist, where the model itself stops on them unless world_g equals the build's value (the lab's patch 06). The entry names schemes by a literal or compiled gravity alone: Earth's fall-speed fits in the microphysics other than Morrison's, which hold no such number, stand outside it"
evidence = ["notes/cm1.md, Earth's gravity left in CM1 outside the lunar cases' paths", "models/cm1/README.md, the lab's patch 06"]

[[entry]]
id = "B11"
model = "exoplasim"
where = "plasim/src/rainmod.f90, mkclouds (zrfac = solar_day * 1000)"
form = "unit of time"
assumes = "a one-day solar day"
when = [{ q = "model_day_days", ne = 1.0, rel_tolerance = 1e-3 }]
effect = "Slingo's cover gains 0.125 ln(day / 1 d), capped at 0.8"
state = "repaired"
repair = { patch = "03-convective-day", switch = "CONVDAY", value = 86400.0, default = 0.0 }
action = "require-switch"
evidence = ["notes/defect_log.md B11"]

[[entry]]
id = "B12"
model = "exoplasim"
where = "plasim/src/rainmod.f90, mkclouds (CCM3 cloud water in geometric height)"
form = "fit beyond its range"
assumes = "Earth's gravity, so that metres stand for pressure"
when = [{ q = "gravity_m_s2", ne = 9.80665, rel_tolerance = 1e-3 }]
effect = "too dry aloft under weaker gravity, too wet under stronger"
state = "repaired"
